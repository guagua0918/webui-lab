<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動｜足弓小幫手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="brand">足弓小幫手</p>
        <p class="brand-sub">矯正運動教學</p>
      </div>
      <div class="account" id="account">
        <a class="account-link" id="account-login" href="api/auth/google/login">登入</a>
        <div class="account-signed" id="account-signed" hidden>
          <button type="button" class="avatar-btn" id="account-toggle" aria-expanded="false" aria-controls="account-dropdown" aria-haspopup="menu">
            <span class="account-name" id="account-name"></span>
            <span class="avatar-face">
              <img class="avatar-photo" id="account-photo" alt="" hidden>
              <span class="avatar-letter" id="account-letter" hidden></span>
            </span>
          </button>
          <div class="account-dropdown" id="account-dropdown" hidden role="menu">
            <a role="menuitem" href="settings">個人設定</a>
            <button type="button" role="menuitem" id="account-logout">登出</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="exercise-root">
      <section id="view-search">
        <h1 class="page-title">運動教學</h1>
        <p class="lead" id="exercise-lead">  </p>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="field-label" for="search-q">搜尋動作</label>
          <div class="suggest-wrap">
            <input
              id="search-q"
              name="q"
              type="search"
              class="field-input"
              placeholder="例如：短足、提踵、伸展…"
              aria-autocomplete="list"
              aria-controls="suggest-list"
              aria-expanded="false"
            >
            <ul id="suggest-list" class="suggest-list" role="listbox" hidden></ul>
          </div>

          <div class="filter-grid" id="filter-grid"></div>

          <div class="search-actions">
            <button type="submit" class="btn btn-primary">搜尋</button>
            <button type="button" class="btn btn-ghost" id="search-reset">清除條件</button>
          </div>
        </form>

        <p class="ex-meta" id="result-count" hidden></p>
        <div id="exercise-list"></div>
      </section>

      <section id="view-detail" hidden></section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="index"><span class="icon">▣</span>總覽</a>
      <span id="nav-subclass"></span>
      <a href="guide"><span class="icon">?</span>教學</a>
    </nav>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/exercise.js"></script>
</body>
</html>
