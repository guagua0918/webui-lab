<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動｜足弓小幫手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="brand">足弓小幫手</p>
        <p class="brand-sub">矯正運動回饋</p>
      </div>
      <div class="account" id="account">
        <a class="account-link" id="account-login" href="api/auth/google/login">登入</a>
        <div class="account-signed" id="account-signed" hidden>
          <button type="button" class="avatar-btn" id="account-toggle" aria-expanded="false" aria-controls="account-dropdown" aria-haspopup="menu">
            <span class="account-name" id="account-name"></span>
            <span class="avatar-face">
              <img class="avatar-photo" id="account-photo" alt="" hidden>
              <span class="avatar-letter" id="account-letter" hidden></span>
            </span>
          </button>
          <div class="account-dropdown" id="account-dropdown" hidden role="menu">
            <a role="menuitem" href="settings">個人設定</a>
            <button type="button" role="menuitem" id="account-logout">登出</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">矯正運動</h1>
      <p class="lead">今日菜單：雙腳提踵 × 3 組</p>

      <article class="card">
        <h2>提踵練習</h2>
        <ol class="list">
          <li>小腿與腳跟貼上標記</li>
          <li>手機置於後方／內側穩定拍攝</li>
          <li>依角度提示調整，避免過度外翻</li>
        </ol>
        <p><span class="status">示意 3° · 安全</span><span class="status status-warn">示意近 10° · 調整</span></p>
        <a class="btn btn-primary" href="exercise">開始提踵（示意）</a>
      </article>

      <article class="card">
        <h2>本次摘要（示意）</h2>
        <div class="meta-row"><span>最大角度</span><strong>8°</strong></div>
        <div class="meta-row"><span>平均角度</span><strong>4°</strong></div>
        <div class="meta-row"><span>超標時間</span><strong>12%</strong></div>
        <a class="btn btn-ghost" href="menu">調整運動菜單</a>
      </article>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="index"><span class="icon">▣</span>總覽</a>
      <span id="nav-subclass"></span>
      <a href="guide"><span class="icon">?</span>教學</a>
    </nav>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
