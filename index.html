<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>總覽｜足弓小幫手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="brand">足弓小幫手</p>
        <p class="brand-sub">居家評估與矯正練習</p>
      </div>
      <div class="account" id="account">
        <a class="account-link" id="account-login" href="api/auth/google/login">登入</a>
        <div class="account-signed" id="account-signed" hidden>
          <button type="button" class="avatar-btn" id="account-toggle" aria-expanded="false" aria-controls="account-dropdown" aria-haspopup="menu">
            <span class="account-name" id="account-name"></span>
            <span class="avatar-face">
              <img class="avatar-photo" id="account-photo" alt="" hidden>
              <span class="avatar-letter" id="account-letter" hidden></span>
            </span>
          </button>
          <div class="account-dropdown" id="account-dropdown" hidden role="menu">
            <a role="menuitem" href="settings">個人設定</a>
            <button type="button" role="menuitem" id="account-logout">登出</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">今日總覽</h1>
      <div class="meta-row">
        <span>最近評估</span>
        <strong>輕度足弓塌陷</strong>
      </div>

      <article class="card">
        <h2>歷史追蹤 · CSI</h2>
        <p class="muted">示意折線（尚未接資料庫）</p>
        <svg class="chart" viewBox="0 0 320 140" role="img" aria-label="足弓指數折線圖">
          <rect x="0" y="0" width="320" height="140" fill="#0a0e14"></rect>
          <line x1="36" y1="16" x2="36" y2="112" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"></line>
          <line x1="36" y1="112" x2="304" y2="112" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"></line>
          <polyline fill="none" stroke="#d6ff4b" stroke-width="2.5" points="48,98 96,84 144,88 192,62 240,48 288,42"></polyline>
          <circle cx="48" cy="98" r="3.5" fill="#d6ff4b"></circle>
          <circle cx="96" cy="84" r="3.5" fill="#d6ff4b"></circle>
          <circle cx="144" cy="88" r="3.5" fill="#d6ff4b"></circle>
          <circle cx="192" cy="62" r="3.5" fill="#d6ff4b"></circle>
          <circle cx="240" cy="48" r="3.5" fill="#d6ff4b"></circle>
          <circle cx="288" cy="42" r="3.5" fill="#d6ff4b"></circle>
          <text x="48" y="130" font-size="11" fill="#8b95a8">1月</text>
          <text x="144" y="130" font-size="11" fill="#8b95a8">3月</text>
          <text x="240" y="130" font-size="11" fill="#8b95a8">5月</text>
        </svg>
      </article>

      <a class="btn btn-primary" href="scan">前往掃描足印</a>
      <a class="btn btn-primary" href="exercise">前往運動</a>
      <div class="btn-row">
        <a class="btn btn-ghost" href="guide">教學</a>
        <a class="btn btn-ghost" href="menu">運動菜單</a>
      </div>
      <p class="note">僅供居家參考，不能取代醫療診斷。<a href="about">完整免責</a></p>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="index"><span class="icon">▣</span>總覽</a>
      <span id="nav-subclass"></span>
      <a href="guide"><span class="icon">?</span>教學</a>
    </nav>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
