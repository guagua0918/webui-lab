<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>足印掃描｜足弓小幫手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="brand">足弓小幫手</p>
        <p class="brand-sub">靜態足印評估</p>
      </div>
      <div class="account" id="account">
        <a class="account-link" id="account-login" href="api/auth/google/login">登入</a>
        <div class="account-signed" id="account-signed" hidden>
          <button type="button" class="avatar-btn" id="account-toggle" aria-expanded="false" aria-controls="account-dropdown" aria-haspopup="menu">
            <span class="account-name" id="account-name"></span>
            <span class="avatar-face">
              <img class="avatar-photo" id="account-photo" alt="" hidden>
              <span class="avatar-letter" id="account-letter" hidden></span>
            </span>
          </button>
          <div class="account-dropdown" id="account-dropdown" hidden role="menu">
            <a role="menuitem" href="settings">個人設定</a>
            <button type="button" role="menuitem" id="account-logout">登出</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">足印掃描</h1>
      <p class="lead" id="scan-lead">先左腳再右腳；系統會建議量測點。</p>

      <section id="panel-side" class="card" hidden>
        <h2>這次先拍哪一腳？</h2>
        <p class="muted">建議先左後右；同一輪評估會記在同一次紀錄裡。</p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-left" data-side="left">左腳</button>
          <button type="button" class="btn btn-primary" id="btn-right" data-side="right">右腳</button>
        </div>
      </section>

      <section id="panel-capture" class="card" hidden>
        <h2 id="capture-title">拍攝／選圖</h2>
        <p id="step" class="step-banner">請拍照或從相簿選取。</p>
        <div class="btn-row">
          <label class="btn btn-primary" for="photo-camera">拍照</label>
          <label class="btn btn-ghost" for="photo-gallery">從相簿選取</label>
        </div>
        <input id="photo-camera" class="file-input" type="file" accept="image/*" capture="environment">
        <input id="photo-gallery" class="file-input" type="file" accept="image/*">
        <div id="stage-prep" class="scan-stage scan-stage-guide" hidden>
          <canvas id="prep-canvas" width="1080" height="1440"></canvas>
          <img id="foot-guide-img" class="foot-guide-img" alt="" src="img/guide-foot-left.png" draggable="false">
        </div>
        <div class="btn-row prep-controls" id="prep-tools" hidden>
          <button type="button" class="btn btn-ghost" id="rot-left">左轉 90°</button>
          <button type="button" class="btn btn-ghost" id="rot-right">右轉 90°</button>
          <button type="button" class="btn btn-ghost" id="zoom-out">縮小</button>
          <button type="button" class="btn btn-ghost" id="zoom-in">放大</button>
          <button type="button" class="btn btn-ghost" id="btn-recenter">照片置中</button>
        </div>
        <label class="muted prep-controls" id="rot-free-wrap" hidden>
          自由旋轉
          <input type="range" id="rot-free" min="-45" max="45" value="0" step="1">
          <span id="rot-free-label">0°</span>
        </label>
        <label class="muted prep-controls" id="zoom-wrap" hidden>
          縮放
          <input type="range" id="zoom-range" min="50" max="250" value="100" step="5">
          <span id="zoom-label">100%</span>
        </label>
        <button type="button" class="btn btn-primary prep-controls" id="btn-upload" hidden disabled>上傳並分析</button>
      </section>

      <section id="panel-wait" class="card" hidden>
        <h2>分析中</h2>
        <div class="scan-wait" aria-live="polite">
          <div class="scan-wait-ring" aria-hidden="true"></div>
          <p id="wait-text" class="step-banner">已收到照片，準備分析…</p>
        </div>
      </section>

      <section id="panel-review" class="card" hidden>
        <h2>確認量測點</h2>
        <p id="review-step" class="step-banner">拖曳微調，或按修改重點。</p>
        <div id="stage" class="scan-stage">
          <img id="photo" alt="對齊後足印預覽">
          <svg id="overlay"></svg>
        </div>
        <div class="meta-row"><span>b 蹠骨最寬</span><strong id="out-b">—</strong></div>
        <div class="meta-row"><span>c 足弓最窄</span><strong id="out-c">—</strong></div>
        <div class="meta-row"><span>CSI</span><strong id="out-csi">—</strong></div>
        <div class="meta-row"><span>判定</span><strong id="out-grade">—</strong></div>
        <div class="btn-row" id="review-actions">
          <button type="button" class="btn btn-primary" id="btn-confirm">確定</button>
          <button type="button" class="btn btn-ghost" id="btn-modify">修改</button>
        </div>
        <div class="btn-row" id="modify-actions" hidden>
          <button type="button" class="btn btn-ghost" id="undo" disabled>撤銷上一點</button>
          <button type="button" class="btn btn-ghost" id="reset" disabled>重新標記</button>
          <button type="button" class="btn btn-primary" id="btn-save-points" disabled>存檔</button>
        </div>
      </section>

      <section id="panel-done" class="card" hidden>
        <h2>本腳已存檔</h2>
        <p id="done-text" class="lead"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-next-foot" hidden>繼續拍另一腳</button>
          <button type="button" class="btn btn-primary" id="btn-finish" hidden>完成此次評估</button>
          <a class="btn btn-ghost" href="exercise">前往運動</a>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="index"><span class="icon">▣</span>總覽</a>
      <span id="nav-subclass"></span>
      <a href="guide"><span class="icon">?</span>教學</a>
    </nav>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
